        /* ===== 清新可爱全局背景与微特效 ===== */
        body {
            background-color: #F8F6F0;
            background-image: radial-gradient(#E8E2D5 1.5px, transparent 1.5px);
            background-size: 24px 24px;
        }

        @keyframes float-egg {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(3deg); }
        }
        .egg-item {
            animation: float-egg 2.5s ease-in-out infinite;
        }
        .egg-item:nth-child(2n){ animation-delay: 0.2s; }
        .egg-item:nth-child(3n){ animation-delay: 0.4s; }
        .egg-item:nth-child(4n){ animation-delay: 0.6s; }

        .fade-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .btn-bounce {
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .btn-bounce:hover:not(:disabled) {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 10px 20px -5px rgba(0,0,0,0.1);
        }
        .btn-bounce:active:not(:disabled) {
            transform: translateY(1px) scale(0.98);
        }

        .modal-mask {
            background: rgba(90, 80, 70, 0.4);
            backdrop-filter: blur(4px);
        }

        /* 打字机效果及光标 */
        .typing-cursor {
            display: inline-block;
            width: 3px;
            height: 1.1em;
            background-color: currentColor;
            margin-left: 2px;
            vertical-align: text-bottom;
            animation: blink 0.8s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* 选项卡片选中态 */
        .opt-card {
            transition: all 0.25s ease;
        }
        .opt-card.selected {
            background-color: #EBF6F0 !important;
            border-color: #7C9A92 !important;
            box-shadow: 0 4px 14px rgba(124, 154, 146, 0.25);
            transform: translateX(4px);
        }

        .theme-ESFP { --card-bg: linear-gradient(135deg, #FFFBEB 0%, #FEF3C7 100%); --border-col: #FCD34D; --text-col: #92400E; }
        .theme-ESTP { --card-bg: linear-gradient(135deg, #FFF7ED 0%, #FFEDD5 100%); --border-col: #FDBA74; --text-col: #9A3412; }
        .theme-ISTJ { --card-bg: linear-gradient(135deg, #F8FAFC 0%, #E2E8F0 100%); --border-col: #CBD5E1; --text-col: #334155; }
        .theme-ISFJ { --card-bg: linear-gradient(135deg, #FFF1F2 0%, #FFE4E6 100%); --border-col: #FECDD3; --text-col: #9F1239; }
        .theme-ESTJ { --card-bg: linear-gradient(135deg, #F0F9FF 0%, #E0F2FE 100%); --border-col: #7DD3FC; --text-col: #075985; }
        .theme-ESFJ { --card-bg: linear-gradient(135deg, #FDF2F8 0%, #FCE7F3 100%); --border-col: #FBCFE8; --text-col: #9D174D; }
        .theme-INFJ { --card-bg: linear-gradient(135deg, #FAF5FF 0%, #F3E8FF 100%); --border-col: #D8B4FE; --text-col: #6B21A8; }
        .theme-INTJ { --card-bg: linear-gradient(135deg, #F1F5F9 0%, #E2E8F0 100%); --border-col: #94A3B8; --text-col: #1E293B; }
        .theme-INFP { --card-bg: linear-gradient(135deg, #ECFDF5 0%, #D1FAE5 100%); --border-col: #6EE7B7; --text-col: #065F46; }
        .theme-INTP { --card-bg: linear-gradient(135deg, #F0FDFA 0%, #CCFBF1 100%); --border-col: #5EEAD4; --text-col: #115E59; }
        .theme-ENFP { --card-bg: linear-gradient(135deg, #FEFCE8 0%, #FEF08A 100%); --border-col: #FDE047; --text-col: #854D0E; }

            border: 3px solid var(--border-col, #A3D9C9);
            color: var(--text-col, #2D3748);

    </style>

// 本地进度存储/读取
function loadSave(){
    const str = localStorage.getItem(STORAGE_KEY);
    if(!str) return null;
    try{ return JSON.parse(str); }catch(e){ localStorage.removeItem(STORAGE_KEY); return null; }
}

function saveProgress(){
    const data = { currentDim, currentQ, dimCount };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function clearSave(){
    localStorage.removeItem(STORAGE_KEY);
}

    answerBox.innerHTML = "";
    selectedAns = null;
    nextBtn.disabled = true;

    // 更新进度条 UI (包含维度内 20 题与总 4 维度的全局比重)
    const totalQInDim = dim.options.length; // 20
    const globalProgressPct = Math.round(((currentDim * 20 + currentQ) / 80) * 100);
    
    progressText.innerText = `${currentDim + 1}/4 维 (第 ${currentQ + 1}/${totalQInDim} 题)`;
    progressBar.style.width = `${globalProgressPct}%`;

    qData.a.forEach((optText)=>{
        const div = document.createElement("div");
        div.className = "opt-card border-2 border-slate-100 bg-slate-50 hover:bg-emerald-50/50 p-4 rounded-2xl cursor-pointer font-medium text-slate-700 text-sm sm:text-base flex items-center gap-3 transition-all";
        
        // 匹配字母
        const letter = optText.match(/\(([A-Z])\)/)?.[1] || '';
        
        div.innerHTML = `<span class="w-6 h-6 rounded-full bg-white text-slate-400 flex items-center justify-center text-xs font-bold border border-slate-200 shrink-0">🥚</span> <span>${optText}</span>`;
        
        div.onclick = ()=>{
            selectedAns = letter;
            document.querySelectorAll(".opt-card").forEach(d => d.classList.remove("selected"));
            div.classList.add("selected");
            nextBtn.disabled = false;
        };
        answerBox.appendChild(div);
    });

    saveProgress();
}

// 选项提交与维度跳转逻辑
nextBtn.onclick = function(){
    if(!selectedAns) return;

    dimCount[selectedAns]++;
    currentQ++;

    const dim = DIMENSIONS[currentDim];
    
    // 如果当前维度的 20 道题目回答完毕
    if(currentQ >= dim.options.length){
        currentDim++;
        currentQ = 0;
    }

    // 4个维度共80题全部完成，跳转结果页
    if(currentDim >= DIMENSIONS.length){
        clearSave();
        showResult();
    } else {
        loadQuestion();
    }
};

// 结果渲染及打字机与专属主题匹配
function showResult(){
    quizPage.classList.add("hidden");
    resultPage.classList.remove("hidden");

    // 计算最高得分为对应字母
    const resultLetter = {
        EI: dimCount.E >= dimCount.I ? "E" : "I",
        SN: dimCount.S >= dimCount.N ? "S" : "N",
        TF: dimCount.T >= dimCount.F ? "T" : "F",
        JP: dimCount.J >= dimCount.P ? "J" : "P"
    };

    const finalType = resultLetter.EI + resultLetter.SN + resultLetter.TF + resultLetter.JP;
    const data = PERSON_DATA[finalType] || PERSON_DATA["ISFP"];

    // 设置人格专属主题背景样式
    const resultCard = document.getElementById("resultCard");
    resultCard.className = `result-theme-card theme-${finalType} rounded-3xl p-6 sm:p-8 text-center shadow-2xl relative overflow-hidden transition-all duration-500`;

    typeCode.innerText = finalType;
    typeName.innerText = data.name;

    resultEggBox.className = `w-28 h-28 mx-auto rounded-full mb-4 flex items-center justify-center text-2xl font-black shadow-lg border-4 border-white/80 ${data.color}`;
    resultEggBox.innerText = finalType;

    // 执行解析文本打字机动画
    typeWriter(data.desc, "resultDesc");
}

// 打字机呈现解析效果
function typeWriter(text, targetId) {
    const container = document.getElementById(targetId);
    container.innerHTML = "";
    
    if (typingTimer) clearInterval(typingTimer);

    let index = 0;
    const cursor = document.createElement("span");
    cursor.className = "typing-cursor";

    typingTimer = setInterval(() => {
        if (index < text.length) {
            container.innerText = text.substring(0, index + 1);
            container.appendChild(cursor);
            index++;
        } else {
            clearInterval(typingTimer);
            if (cursor.parentNode) {
                cursor.parentNode.removeChild(cursor);
            }
        }
    }, 25);
}

// 重新测试
function restartTest(){
    clearSave();
    if (typingTimer) clearInterval(typingTimer);

    currentDim = 0;
    currentQ = 0;
    dimCount = {I:0,E:0,S:0,N:0,T:0,F:0,J:0,P:0};

    resultPage.classList.add("hidden");
    quizPage.classList.remove("hidden");
    loadQuestion();
}

// 恢复按钮事件绑定
resumeBtn.onclick = function(){
    resumeModal.classList.add("hidden");
    startPage.classList.add("hidden");
    quizPage.classList.remove("hidden");
    loadQuestion();
};

restartClearBtn.onclick = function(){
    clearSave();
    currentDim = 0;
    currentQ = 0;
    dimCount = {I:0,E:0,S:0,N:0,T:0,F:0,J:0,P:0};
    resumeModal.classList.add("hidden");
};

// 页面加载自动检测存档
window.onload = function(){
    const saveData = loadSave();
    if(saveData && (saveData.currentDim > 0 || saveData.currentQ > 0)){
        currentDim = saveData.currentDim || 0;
        currentQ = saveData.currentQ || 0;
        dimCount = saveData.dimCount || {I:0,E:0,S:0,N:0,T:0,F:0,J:0,P:0};
        resumeModal.classList.remove("hidden");
    }
};
</script>
